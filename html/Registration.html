<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="#">
        <label for="name">Full Name:</label>
        <input type="text" placeholder="enter your name" name="name" id="name" required> <br>
        <label for="email">Email:</label>
        <input type="email" placeholder="enter your email" name="email" id="email" required> <br>
        <label for="Password">Confirm Password:</label>
        <input type="Password" placeholder="enter your Password" name="Password" id="Password" required> <br>
        <label for="age">age:</label>
        <input type="number" placeholder="enter your age" name="age" id="age" min="17" max="100" required><br>
        <label for="DOB">Date of Birth:</label>
        <input type="date" placeholder="enter your Date of Birth" name="Date of Birth" id="DOB" required> <br>
        <label for="Gender">Select your Gender:</label>
        <div>
        <input type="radio" placeholder="enter your Gender" name="Gender" id="Male" value="Male" required>
        <label for="Male">Male</label>
        <input type="radio" placeholder="enter your Gender" name="Gender" id="Female" value="Female" required>
        <label for="Female">Female</label>
        <input type="radio" placeholder="enter your Gender" name="Gender" id="Other" value="Other" required>
        <label for="Other">Other</label>
        </div>
        <div>
        Hobbies <br>
        <input type="checkbox"  name="Codding" id="Codding" > 
        <label for="Codding">Codding:</label>
        <br>
        <input type="checkbox" name="Reading" id="Reading" > 
        <label for="Reading">Reading Books:</label>
        <br>
        <input type="checkbox" name="Playing" id="Playing" > 
        <label for="Playing">Playing Volleyball:</label>
        <br>
        <input type="checkbox" name="Singing" id="Singing" > 
        <label for="Singing">Singing:</label>
        </div>
        <label for="branch">select your branch</label>
        <select name="branch" id="branch">
            <option value="branch">select your branch</option>
            <option value="computer science">computer science</option>
            <option value="electronics">electronics</option>
            <option value="electrical engineering">electrical engineering</option>
            <option value="civil">civil</option>
        </select>
        <br>
        <label for="Address">Please Enter your Address</label>
        <textarea name="Address" id="Address" placeholder="Enter your Address" rows="4" cols="80"></textarea> <br>
        <label for="file">Upload your photo</label>
        <input type="file" id="file" required><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
