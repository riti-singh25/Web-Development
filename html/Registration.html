<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="server">
        <label for="name">Full Name:</label>
        <input type="text" placeholder="enter your name" name="name" id="name" "required> <br>
        <label for="name">Email:</label>
        <input type="email" placeholder="enter your email" name="email" id="email" "required> <br>
        <label for="name">Password:</label>
        <input type="Password" placeholder="enter your Password" name="Password" id="Password" "required>
        <button type="confirm" >confirm password</button><br>
        <label for="age">age:</label>
        <input type="number" placeholder="enter your age" name="age" id="age" "required><br>
        <label for="DOB">Date of Birth:</label>
        <input type="date" placeholder="enter your Date of Birth" name="Date of Birth" id="DOB" "required> <br>
        <label for="Gender">Select your Gender:</label>
        <div>
        <input type="radio" placeholder="enter your Gender" name="Gender" id="Gender" value="Male" "required>
        <label for="Male">Male</label>
        <input type="radio" placeholder="enter your Gender" name="Gender" id="Gender" value="Female" "required>
        <label for="Female">Female</label>
        <input type="radio" placeholder="enter your Gender" name="Gender" id="Gender" value="Not Specified" "required>
        <label for="Not Specified">Not Specified</label>
        </div>
        <div>
        Hobbies <br>
        <input type="checkbox" placeholder="enter your Hobbies" name="Codding" id="Codding" "required> 
        <label for="Codding">Codding:</label>
        <br>
        <input type="checkbox" placeholder="enter your Hobbies" name="Codding" id="Reading" "required> 
        <label for="Reading">Reading Books:</label>
        <br>
        <input type="checkbox" placeholder="enter your Hobbies" name="Codding" id="Playing" "required> 
        <label for="Playing">Playing Volleyball:</label>
        <br>
        <input type="checkbox" placeholder="enter your Hobbies" name="Codding" id="Singing" "required> 
        <label for="Singing">Singing:</label>
        
        </div>

        
    </form>
</body>
</html>
